name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev uuid-dev liblzma-dev
          pip install --user --upgrade buildozer cython virtualenv

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure Buildozer Spec
        run: |
          sed -i 's/title = My Application/title = Smart AI Agent/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = smartaiagent/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.tiger/g' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py/g' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,requests/g' buildozer.spec

      - name: Build with Buildozer
        run: buildozer android debug
        continue-on-error: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Smart-AI-Agent-APK
          path: bin/*.apk
